# Hard spheres near the MCT glass transition.
#
# The packing fraction eta = 0.53 is above the MCT critical value
# eta_c ~ 0.516 (with PY input), so the non-ergodicity parameter
# F(q) converges to a nonzero plateau — the system is an ideal glass.
#
# Usage:
#   liquidie solve  -c examples/hard_sphere_mct_glass.toml -o results_mct/
#   liquidie mct    -c examples/hard_sphere_mct_glass.toml -i results_mct/ -o results_mct/
#
# r_max is kept short to bound the MCT kernel, which scales as O(n_pts^3)
# per iteration, but dr must stay fine enough to resolve the hard core:
# on this grid the full OZ -> MCT pipeline gives eta_c ~ 0.517, while at
# dr=0.05 the structure is still too soft and eta_c rises to ~0.525.
#
# References:
#   Bengtzelius, Gotze & Sjolander, J. Phys. C 17, 5915 (1984)
#   Gotze, Complex Dynamics of Glass-Forming Liquids (Oxford, 2009)

[system]
temperature = 1.0
density = [1.0122]    # rho = 6*eta/pi with eta = 0.53

[grid]
dr = 0.02
r_max = 10.24

[potential]
expression = "hard_sphere"
epsilon = [1.0]
sigma = [1.0]

[solver]
closure = "PY"
tolerance = 1e-8

[restart]
enabled = false
file = "gamma.dat"

[output]
directory = "./results_mct_glass"
